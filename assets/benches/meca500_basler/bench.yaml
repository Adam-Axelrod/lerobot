# Automated-collection config for Huanyu's setup (bench 2, rig meca500_basler).
# Waiting on: the scope calibration and a touch pose measured with the current pipette.
#
# Units: mm and degrees. Frame: the robot's base reference frame (BRF) - origin at the
# bottom-centre of the Meca500 base, z up, x/y as the robot reports them in GetPose().
# Export the Fusion 360 scene in this frame so the STLs need no further transform.

obstacles:
  # STLs relative to this folder, one per body (frame, stage, illuminator column, lamp head,
  # ...). Closed (watertight) bodies, mm, BRF. Do NOT include the robot or the tool.
  # From cad/huanyu_setup/export/ (Fusion: top-level Save As Mesh, one file per body),
  # shifted into the BRF: the CAD robot's J1 axis is at CAD (-147.5, 85.5, 0), no rotation
  # (URDF links at zero joints overlay the CAD links to ~1 mm median).
  # Optical axis (stage + plate holes) at BRF (237.5, -85.5); the illuminator's underside is
  # at z = 95 on that axis and z = 60 within 20 mm of it; stage top at z = 31.
  meshes: [obstacles/base_plate.stl, obstacles/translation_stage.stl, obstacles/illuminator.stl]
  sdf_pitch_mm: 2.0
  # Optional primitives, for anything quick to measure or that moves (e.g. the dish).
  # boxes:     [{name: lamp_head, center: [x, y, z], size: [dx, dy, dz], yaw_deg: 0}]
  # cylinders: [{name: dish_wall, base: [x, y, z], radius: 17.5, height: 10}]   # vertical
  boxes: []
  cylinders: []

tool:
  # Holder + pipette as one STL in the FLANGE frame (Meca FRF: origin on the flange face,
  # z out of the flange), mm. Optional but strongly recommended.
  # cad/huanyu_setup/export/tool_*.stl (F/T sensor + mount, wrist camera mount, pipette
  # holder + attachment, 150 mm pipette tilted 44 deg off the flange axis), re-expressed in the FRF.
  mesh: tool.stl
  # Tip frame in the flange frame, as a Meca pose [x, y, z, alpha, beta, gamma].
  # Its z axis must point ALONG the pipette, out of the tip. If the robot's TRF is already
  # set to the tip, this is the same pose as SetTrf().
  # From the CAD: tip at the pipette's free end, ~149 mm straight out along the flange axis;
  # z along the pipette (clamp end -> tip). NOT yet checked on the arm - the CAD's
  # rotation of the tool about the flange axis cannot be read off a zero-pose model,
  # because J4 and J6 are collinear there.
  # (Huanyu's basler_pipette_2026-09-16 demos used a DIFFERENT pipette: their end poses
  # imply a tip ~118 mm out, so they say nothing about this one.)
  tip_pose_in_flange: [-0.5, 0.25, 149.39, 34.72, 28.96, -18.54]
  # Tool points closer than this to the tip are not collision-checked: the tip touches
  # the dish by design.
  tip_exempt_mm: 10

safety:
  link_margin_mm: 15        # clearance required for the arm links
  tool_margin_mm: 5         # clearance required for holder + pipette (minus the exempt tip)
  joint_limit_margin_deg: 2
  min_abs_j5_deg: 5         # keep away from the wrist singularity at J5 = 0
  check_step_deg: 0.5       # densify paths so no joint moves more than this between checks
  point_spacing_mm: 4
  safe_joints: [-90, 40, 20, 90, 80, -110]   # HOME_JOINTS["meca500_basler"]
  max_attempts: 200

scope:
  camera_key: microscope_cam
  calibration: scope_calibration.json   # written by scripts/meca500/calibrate_scope.py

start:
  # Every basler_pipette_2026-09-16 demo started exactly at HOME_JOINTS (std < 0.12 deg).
  nominal_joints: [-90, 40, 20, 90, 80, -110]
  pos_jitter_mm: [20, 20, 10]
  rot_jitter_deg: 3
  min_height_above_surface_mm: 5

target:
  edge_margin_px: 60        # keep the target this far from the image edges
  touch_offset_mm: 0.0      # +ve stops this far ABOVE the measured dish surface
  style: {radius_px: 14, thickness_px: 2, cross_px: 6, color: [0, 255, 0], outline_color: [0, 0, 0]}

approach:
  # A natural "tip touching the dish" pose WITH THE CURRENT PIPETTE. Not set: the medoid
  # demo end pose ([-53.32, 51.85, 19.53, 128.56, 69.73, -126.21]) was with a different
  # pipette, so it would put this tip somewhere else. calibrate_scope.py prints the joints
  # at every surface (z) sample - paste one of those here.
  # PROVISIONAL (2026-10-13): best of suggest_touch_pose.py with the dish assumed at z = 32.5
  # (no calibration yet): pipette 35 deg below horizontal, tool 11.5 mm beyond its margin.
  # Replace with a measured pose (calibrate_scope.py) before touching the dish.
  touch_nominal_joints: [-54.43, 14.59, 50.51, 98.3, 41.47, -23.66]
  touch_rot_jitter_deg: 2
  gate_back_mm: [15, 40]       # straight final approach along the pipette axis
  pretouch_back_mm: [1, 4]     # precision phase length
  pretouch_lateral_mm: 0.3
  n_via: [1, 2]
  via_jitter_mm: [15, 15, 10]

motion:
  fps: 20
  coarse_speed_mm_s: [8, 15]
  gate_speed_mm_s: [2, 4]
  precision_speed_mm_s: [0.2, 0.5]
  dwell_s: [0.5, 1.5]
  max_joint_step_deg: 1.0            # per frame; bench 2 demos: coarse p95 0.53, max 1.34
  max_joint_step_precision_deg: 0.1  # per frame; bench 2 demos: precision p95 0.038, max 0.107
  retreat_mm: 30
  transit_speed_deg_s: 15

registration:
  # 3-6 sharp, reachable features for register_bench.py, with CAD coordinates (BRF, mm).
  # points:
  #   - {name: column_corner, cad_xyz: [x, y, z], description: "front-left top corner of the illuminator column"}
  points: []
